---
layout: default
---

{%- if page.title == "About" -%}
<div class="col-lg-10 mx-auto mt-5 markdown-body">
  {{ content }}
</div>
{%- else -%}
<div class="row justify-content-center mt-5 post-container">
  <div class="col-12 col-lg-8 col-xl-8 markdown-body post-article">
    {{ content }}
  </div>
  <div class="d-none d-lg-block col-lg-4 col-xl-3 toc-column">
    <aside id="toc-sidebar" class="toc-sidebar sticky-top" aria-label="Table of contents">
      <div class="toc-wrapper">
        <div class="toc-header">
          <span class="toc-header-title">
            <i class="fas fa-list-ul mr-1"></i> 목차
          </span>
          <a href="#" class="toc-top-btn" title="맨 위로">
            <i class="fas fa-arrow-up"></i>
          </a>
        </div>
        <nav class="toc-content">
          {% include toc.html html=content class="toc-list" id="toc-list" h_min=1 h_max=3 %}
        </nav>
      </div>
    </aside>
  </div>
</div>
{%- endif -%}

<script>
document.addEventListener("DOMContentLoaded", function () {
  var tocSidebar = document.getElementById("toc-sidebar");
  if (!tocSidebar) return;

  var tocColumn = document.querySelector(".toc-column");
  var postArticle = document.querySelector(".post-article");
  var tocList = document.getElementById("toc-list");
  var tocLinks = tocList ? Array.from(tocList.querySelectorAll("a")) : [];

  // Hide TOC and expand article if no links exist
  if (tocLinks.length === 0) {
    if (tocColumn) tocColumn.style.display = "none";
    if (postArticle) {
      postArticle.className = "col-lg-10 mx-auto markdown-body post-article";
    }
    return;
  }

  // Smooth scroll to top button
  var topBtn = tocSidebar.querySelector(".toc-top-btn");
  if (topBtn) {
    topBtn.addEventListener("click", function (e) {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  }

  // Smooth scroll for TOC links
  var headingMap = [];
  tocLinks.forEach(function (link) {
    var href = link.getAttribute("href");
    if (href && href.startsWith("#")) {
      var targetId = decodeURIComponent(href.slice(1));
      var targetElem = document.getElementById(targetId);
      if (targetElem) {
        headingMap.push({ link: link, elem: targetElem });
      }

      link.addEventListener("click", function (e) {
        e.preventDefault();
        var targetElem = document.getElementById(targetId);
        if (targetElem) {
          var navOffset = 80;
          var targetPosition = targetElem.getBoundingClientRect().top + window.pageYOffset - navOffset;
          window.scrollTo({ top: targetPosition, behavior: "smooth" });
          history.pushState(null, null, href);
        }
      });
    }
  });

  if (headingMap.length === 0) {
    tocSidebar.style.display = "none";
    return;
  }

  var currentActive = null;
  var tocContent = tocSidebar.querySelector(".toc-content");

  function updateActiveHeading() {
    var scrollY = window.pageYOffset || document.documentElement.scrollTop;
    var offset = 100;

    var activeItem = null;
    for (var i = 0; i < headingMap.length; i++) {
      var headingTop = headingMap[i].elem.getBoundingClientRect().top + scrollY;
      if (scrollY >= headingTop - offset) {
        activeItem = headingMap[i];
      } else {
        break;
      }
    }

    if (!activeItem && headingMap.length > 0 && scrollY < 200) {
      activeItem = headingMap[0];
    }

    if (activeItem && activeItem.link !== currentActive) {
      if (currentActive) {
        currentActive.classList.remove("toc-active");
      }
      currentActive = activeItem.link;
      currentActive.classList.add("toc-active");

      // Auto scroll inside TOC container if needed
      if (tocContent) {
        var linkRect = currentActive.getBoundingClientRect();
        var containerRect = tocContent.getBoundingClientRect();
        if (linkRect.top < containerRect.top || linkRect.bottom > containerRect.bottom) {
          currentActive.scrollIntoView({ block: "nearest", behavior: "smooth" });
        }
      }
    }
  }

  var ticking = false;
  window.addEventListener("scroll", function () {
    if (!ticking) {
      window.requestAnimationFrame(function () {
        updateActiveHeading();
        ticking = false;
      });
      ticking = true;
    }
  }, { passive: true });

  updateActiveHeading();
});
</script>
